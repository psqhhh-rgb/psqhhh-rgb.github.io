    <style>
        :root {
            --bg-color: #323232;
            --text-color: #ffffff;
            --pinyin-color: #a0a0a0;
            --accent-color: #8c8c8c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部控制栏 */
        header {
            padding: 15px 20px;
            background-color: rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .title { font-size: 18px; font-weight: bold; letter-spacing: 2px; }
        
        .controls { display: flex; gap: 10px; }
        
        select, button {
            background: #555;
            color: #fff;
            border: 1px solid #777;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        
        button:hover { background: #666; }

        /* 主体阅读区 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; /* 垂直居中 */
            align-items: center;     /* 水平居中 */
            padding: 0 10%;          /* 左右留白 */
            position: relative;
            user-select: none;       /* 防止误选文字 */
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #ddd;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #text-content {
            font-size: 2.5rem; /* 默认大字号 */
            font-weight: bold;
            line-height: 1.8;
            text-align: center;
            letter-spacing: 0.1em;
            max-width: 1400px;
            transition: opacity 0.3s ease;
        }

        /* 拼音样式 */
        ruby { ruby-position: over; margin: 0 2px; }
        rt {
            font-size: 0.4em;
            color: var(--pinyin-color);
            font-weight: normal;
            letter-spacing: 0;
            margin-bottom: 5px;
        }

        /* 底部进度条 */
        .progress-bar {
            height: 4px;
            background: #444;
            width: 100%;
            position: fixed;
            bottom: 0;
        }
        .progress-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 0.3s;
        }

        /* 点击翻页区域 (透明) */

            position: absolute;
            top: 60px;
            bottom: 0;
            width: 20%;
            z-index: 5;
            cursor: pointer;
        }
        .left-area { left: 0; }
        .right-area { right: 0; }

        /* 响应式适配 */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; margin-bottom: 15px; }
            #text-content { font-size: 1.6rem; line-height: 2.2; }
            main { padding: 0 5%; }
            header { flex-direction: column; gap: 10px; }
        }

        .hide-pinyin rt { display: none; }
        .hide-pinyin #text-content { line-height: 1.5; }

    <script>
        // === 完整文本数据 (基于您提供的PDF OCR清洗整理) ===
        const bookData = [
            // --- 上篇 德经 ---
            {t:"第1章", c:"上德不德，是以有德，下德不失德，是以无德。上德无为而无以为也，上仁为之而无以为也，上义为之而有以为也，上礼为之而莫之应也，则攘臂而扔之。故失道矣而后德，失德而后仁，失仁而后义，失义而后礼。夫礼者，忠信之薄也，而乱之首也。前识者，道之华也，而愚之首也。是以大丈夫居其厚而不居其薄，居其实而不居其华，故去彼取此。"},
            {t:"第2章", c:"昔之得一者，天得一以清，地得一以宁，神得一以灵，浴（谷）得一以盈，侯王得一而以为天下正。其致之也，谓天毋以清，将恐裂。谓地毋以宁，将恐发。谓神毋以灵，将恐歇。谓谷毋以盈，将恐竭。谓侯王毋以贵以高，将恐蹶。故必贵而以贱为本，必高矣而以下为基。夫是以侯王自谓孤寡不谷，此其贱之本与？非也。故致数（硕）誉无誉。是故不欲禄禄若玉，珞珞若石。"},
            {t:"第3章", c:"上士闻道，堇能行之。中士闻道，若存若亡。下士闻道，大笑之。弗笑，不足以为道。是以建言有之曰：明道如费，进道如退，夷道如纇（泪）。上德如浴（谷），大白如辱，广德如不足。建德如偷，质真如渝，大方无隅，大器免成，大音希声，天象无形，道褒无名。夫唯道，善始且善成。"},
            {t:"第4章", c:"反也者，道之动也。弱也者，道之用也。天下之物生于有，有生于无。"},
            {t:"第5章", c:"道生一，一生二，二生三，三生万物。万物负阴而抱阳，中气以为和。天下之所恶，唯孤，寡，不谷，而王公以自名也。物或损之而益，益之而损。故人之所教，亦议而教人，故强梁者不得死，我将以为学父。"},
            {t:"第6章", c:"天下之至柔，驰骋于天下之至坚。无有入于无间，吾是以知无为之有益也。不言之教，无为之益，天下希能及之矣。"},
            {t:"第7章", c:"名与身孰亲？身与货孰多？得与亡孰病？甚爱必大费，多藏必厚亡。故知足不辱，知止不殆，可以长久。"},
            {t:"第8章", c:"大成若缺，其用不弊。大盈若盅（冲），其用不穷。大直如屈，大巧如拙，大赢如绌（处）。躁胜寒，静胜热，清静可以为天下正。"},
            {t:"第9章", c:"天下有道，却走马以粪。天下无道，戎马生于郊。罪莫大于可欲，祸莫大于不知足，咎莫憯（惨）于欲得。故知足之足，恒足矣。"},
            {t:"第10章", c:"不出于户，以知天下。不窥于牖（有），以知天道。其出也弥远，其知弥少。是以圣人不行而知，不见而明，弗为而成。"},
            {t:"第11章", c:"为学者日益，闻道者日损，损之又损，以至于无为。无为而无不为。圣人之取天下也，恒无事。及其有事也，不足以取天下。"},
            {t:"第12章", c:"圣人恒无心，以百姓之心为心。善者善之，不善者亦善之，德善也。信者信之，不信者亦信之，德信也。圣人之在天下也，歙歙焉，为天下浑心。百姓皆属（主）耳目焉，圣人皆晐（该）之。"},
            {t:"第13章", c:"出生入死。生之徒十有三；死之徒十有三；而民生生，动皆之死地之十有三。夫何故也？以其生生也。盖闻善摄生者，陵行不避兕虎，入军不被（披）甲兵。兕无所投其角，虎无所措其爪，兵无所容其刃。夫何故也？以其无死地焉。"},
            {t:"第14章", c:"道生之而德畜之，物形之而器成之，是以万物尊道而贵德。道之尊，德之贵也，夫莫之爵，而恒自然也。道生之，蓄之，长之，育之，亭之，毒之，养之，覆之。生而弗有也，为而弗持也，长而弗宰也，此之谓玄德。"},
            {t:"第15章", c:"天下有始，以为天下母。既得其母，以知其子。既知其子，复守其母，没身不殆。塞其兑，闭其门，终身不堇。启其兑，济其事，终身不救。见小曰明，守柔曰强。用其光，复归其明。无遗身殃。是谓袭常。"},
            {t:"第16章", c:"使我挈（窃）有知，行于大道，唯遗是畏。大道甚夷，民甚好径。朝甚除，田甚芜，仓甚虚。服文采，带利剑，厌食而资财有余，是谓盗竽，非道也。"},
            {t:"第17章", c:"善建者不拔，善抱者不脱，子孙以祭祀不绝。修之身，其德乃真。修之家，其德有余。修之乡，其德乃长（常）。修之邦，其德乃丰。修之天下，其德乃博。以身观身，以家观家，以乡观乡，以邦观邦，以天下观天下。吾何以知天下之然哉？以此。"},
            {t:"第18章", c:"含德之厚者，比于赤子。蜂虿（吃爱）虺（悔）蛇弗螫（是），攫鸟猛兽弗搏。骨弱筋柔而握固，未知牝牡之会而朘（资微）怒，精之至也。终日号而不嚘（忧），和之至也。和曰常，知和曰明，益生曰祥，心使气曰强。物壮即老，谓之不道，不道早已。"},
            {t:"第19章", c:"知者弗言，言者弗知。塞其兑，闭其门，和其光，同其尘，挫其锐，解其纷，是谓玄同。故不可得而亲，亦不可得而疏。不可得而利，亦不可得而害。不可得而贵，亦不可得而贱。故为天下贵。"},
            {t:"第20章", c:"以正治邦，以畸用兵，以无事取天下。吾何以知其然也哉？夫天下多忌讳，而民弥贫。民多利器，而邦家滋昏。人多智，而苛物滋起。法物滋彰，而盗贼多有。是以圣人之言曰：我无为而民自化，我好静而民自正，我无事而民自富，我欲不欲而民自朴。"},
            {t:"第21章", c:"其政闷闷，其民墩墩。其政察察，奇邦夬夬（怪）。祸，福之所倚。福，祸之所伏。孰知其极？其无正也。正复为奇，善复为妖。人之迷也，其曰固久矣。是以方而不割，廉而不刺，直而不肆，光而不耀。"},
            {t:"第22章", c:"治人事天，莫若啬。夫唯啬，是以早服。早服是谓重（众）积德，重积德则无不克，无不克则莫知其极。莫知其极，可以有国，有国之母，可以长久。是谓深根固柢（底），长生久视之道也。"},
            {t:"第23章", c:"治大国若烹小鲜。以道莅（立）天下，其鬼不神。非其鬼不神也，其神不伤人也。非其神不伤人也，圣人亦弗伤也。夫两不相伤，故德交归焉。"},
            {t:"第24章", c:"大邦者，下流也，天下之牝，天下之交也。牝恒以静胜牡，为其静也，故宜为下。大邦以下小邦，则取小邦。小邦以下大邦，则取于大邦。故或下以取，或下而取。故大邦者，不过欲兼畜人。小邦者，不过欲入事人。夫皆得其欲，则大者宜为下。"},
            {t:"第25章", c:"道者，万物之注也，善人之宝也，不善人之所保也。美言可以市，尊行可以贺人。人之不善也，何弃之有。故立天子，置三卿，虽有拱之璧以先驷马，不若坐而进此。古之所以贵此者何也？不谓求以得，有罪以免与？故为天下贵。"},
            {t:"第26章", c:"为无为，事无事，味无味，大小，多少，报怨以德。图难乎其易也，为大乎其细也。天下之难作于易，天下之大作于细。是以圣人终不为大，故能成其大。夫轻诺必寡信，多易必多难。是以圣人犹难之，故终于无难。"},
            {t:"第27章", c:"其安也，易持也。其未兆也，易谋也。其脆也，易判也。其微也，易散也。为之于其未有也，治之于其未乱也。合抱之木，生于毫末九成之台，作于羸土。百仞之高，始于足下。为之者败之，执之者失之。是以圣人无为也，故无败也，无执也，故无失也。民之从事也，恒于其成事而败之。故慎终若始，则无败事矣。是以圣人欲不欲，则不贵难得之货。学不学，而复众人之所过。能辅万物之自然，而弗敢为。"},
            {t:"第28章", c:"故曰，为道者非以明民也，将以愚之也。民之难治也，以其智也。故以智治邦，邦之贼也，以不智治邦，邦之德也。恒知此两者，亦稽式也。恒知稽式，此谓玄德。玄德深矣，远矣，与物反矣，乃至大顺。"},
            {t:"第29章", c:"江海之所以能为百浴（谷）王者，以其善下之，是以能为百（浴）谷王。是以圣人之欲上民也，必以其言下之，其欲先民也，必以其身后之。故居前而民弗害也，居上而民弗重也，天下乐推而弗厌也。非以其无争与？故天下莫能与争。"},
            {t:"第30章", c:"小邦寡民，使有十百人之器而毋（勿）用，使民重死而远徙。有舟车，无所乘之。有甲兵，无所陈之。使民复结绳而用之。甘其食，美其服，乐其俗，安其居。邻邦相望，鸡狗之声相闻，民至老死，不相往来。"},
            {t:"第31章", c:"信言不美，美言不信，知者不博，博者不知，善者不多，多者不善。圣人无积，既以为人己愈有。既以予人矣，己愈多。故天之道，利而不害。人之道，为而弗争。"},
            {t:"第32章", c:"天下皆谓我大，大而不肖。夫唯大，故不肖，若肖久矣其细也夫。我恒有三宝，持而宝之。一曰慈，二曰俭，三曰不敢为天下先。夫慈，故能勇；夫俭，故能广；不敢为天下先，故能为成事长(掌)。今舍其慈，且勇；舍其俭，且广；舍其后，且先，则必死矣。夫慈，以战则胜，以守则固。天将建之，如以慈坦之。"},
            {t:"第33章", c:"善为士者不武，善战者不怒，善胜敌者弗与。善用人者为之下。是谓不争之德，是谓用人，是谓配天，古之极也。"},
            {t:"第34章", c:"用兵有言曰，吾不敢为主而为客，吾不敢进寸而退尺。是谓行（形）无行（航），攘无臂，执无兵，乃无敌矣。祸莫大于无适，无适近亡吾宝矣。故称兵相若，则哀者胜矣。"},
            {t:"第35章", c:"吾言甚易知也，甚易行也。而人莫之能知也，而莫之能行也。言有君，事有宗。夫唯无知也，是以不我知。知我者希，则我贵矣。是以圣人被（披）褐而怀玉。"},
            {t:"第36章", c:"知不知，尚矣。，不知不知，病矣。是以圣人之不病，以其病病，是以不病。"},
            {t:"第37章", c:"民之不畏威，则大威将至矣。无狭其所居，无厌（压）其所生。夫唯弗厌（压），是以不厌。是以圣人自知而不自见也，自爱而不自贵也，故去彼取此。"},
            {t:"第38章", c:"勇于敢者则杀，勇于不敢者则活。此两者，或利或害。天之所恶，孰知其故？天之道，不战而善胜，不言而善应，不召而自来，坦而善谋。天网恢恢，疏而不失。"},
            {t:"第39章", c:"民恒且不畏死，奈何以杀惧之也？若民恒畏死，则而为者，吾将得而杀之，夫孰敢矣！若民恒且必畏死，则恒有司杀者。夫代司杀者杀，是代大匠斫（卓）也。夫代大匠斫者，则希不伤其手矣。"},
            {t:"第40章", c:"人之饥也，以其取食税之多也，是以饥。百姓之不治也，以其上有以为也，是以不治。民之轻死，以其求生之厚也，是以轻死。夫唯无以生为者，是贤贵生。"},
            {t:"第41章", c:"人之生也柔弱，其死也恒韧坚强。万物草木之生也柔脆，其死也枯槁。故曰坚强者死之徒也，柔弱微细生之徒也。兵强则不胜，木强则恒，强大居下，柔弱微细居上。"},
            {t:"第42章", c:"天之道，犹张弓者也。高者抑之，下者举之，有余者损之，不足者补之。故天之道，损有余而补不足。人之道则不然，损不足而奉有余。孰能有余而有以取奉于天者乎？唯有道者乎？是以圣人为而弗有，成功而弗居。若此，其不欲见（现）贤也。"},
            {t:"第43章", c:"天下莫柔弱于水，而攻坚强者莫之能胜也，以其无以易之也。柔之胜刚，弱之胜强，天下莫弗知也，而莫能行也。故圣人之言云，曰：受邦之垢，是为社稷之主。受邦之不祥，是谓天下之王。正言若反。"},
            {t:"第44章", c:"和大怨，必有余怨，焉可以为善？是以圣人执若契，而不以责于人。故有德司契，无德司彻。夫天道弗亲，恒与善人。"},
            
            // --- 下篇 道经 ---
            {t:"第45章", c:"道可道，非恒道也。名可名，非恒名也。无名，万物之始也。有名，万物之母也。故恒无欲也，以观其妙。恒有欲也，以观其所徼（叫）。两者同出，异名同谓，玄之又玄，众妙之门。"},
            {t:"第46章", c:"天下皆知美，为美，恶已。皆知善，訾（子）不善矣。有，无之相生也。难，易之相成也。长，短之相形也。高，下之相盈也。音，声之相和也。先，后之相随，恒也。是以圣人居无为之事，行不言之教。万物作而弗始也，为而弗持也，成功而弗居也。夫唯弗居，是以弗去。"},
            {t:"第47章", c:"不尚贤，使民不争。不贵难得之货，使民不为盗。不见（现）可欲，使民不乱。是以圣人之治也，虚其心，实其腹，弱其志，强其骨。恒使民无知无欲也。使夫智不敢，弗为而已，则无不治矣。"},
            {t:"第48章", c:"道盅（冲），而用之又弗盈也。渊呵，似万物之宗。挫其锐，解其纷，和其光，同其尘。湛呵，似或存。吾不知其谁之子也，象帝之先。"},
            {t:"第49章", c:"天地不仁，以万物为刍狗。圣人不仁，以百姓为刍狗。天地之间，其犹橐（驼）籥（月）与！虚而不屈，动而愈出。多闻数穷，不若守于中。"},
            {t:"第50章", c:"浴（谷）神不死，是谓玄牝。玄牝之门，是谓天地之根。绵绵呵若存，用之不堇（紧）。"},
            {t:"第51章", c:"天长地久。天地之所以能长且久者，以其不自生也，故能长生。是以圣人退其身而身先，外其身而身存。不以其无私与？故能成其私。"},
            {t:"第52章", c:"上善治水。水善利万物而有静，居众人之所恶，故几于道矣。居善地，心善渊，予善天，言善信政善治，事善能，动善时。夫唯不争，故无尤。"},
            {t:"第53章", c:"㨁（智）而盈之，不若其已。揣而允之，不可长保也。金玉盈室，莫之守也。富贵而骄，自遗咎也。功遂身退，天之道也。"},
            {t:"第54章", c:"载营魄抱一，能无离乎？抟（团）气致柔，能婴儿乎？修除玄鉴，能无疵（资）乎？爱民治国，能毋以智乎？天门启阖（合），能为慈乎？明白四达，能勿以知乎？生之畜之，生而弗有，长（掌）而弗宰也，是谓玄德。"},
            {t:"第55章", c:"卅（萨）辐同一毂（谷），当其无，有车之用也。埏（山）埴（直）为器，当其无，有埴器之用也。凿户牖（有），当其无，有室之用也。故有之以为利，无之以为用。"},
            {t:"第56章", c:"五色使人目盲。驰骋田猎使人心发狂。难得之货，使人之行妨。五味使人之口爽，五音使人之耳聋。是以圣人之治也，为腹不为目，故去彼取此。"},
            {t:"第57章", c:"宠辱若惊，贵大患若身。何谓宠辱若惊？宠之为下，得之若惊，失之若惊，是谓宠辱若惊。何谓贵大患若身？吾所以有大患者，为吾有身也。及吾无身，有何患。故贵为身于为天下，若可以托天下矣。爱以身为天下，如何以寄天下。"},
            {t:"第58章", c:"视之而弗见，名之曰微。听之而弗闻，名之曰希。捪（民）之而弗得，名之曰夷。三者不可致诘，故混而为一。一者，其上不攸（优），其下不忽。寻寻呵不可名也，复归于无物。是谓无状之状，无物之象，是谓恍惚。随而不见其后，迎而不见其首。执今之道，以御今之有，以知古始，是谓道纪。"},
            {t:"第59章", c:"古之善为道者，微妙玄达，深不可识。夫唯不可识，故强为之容。曰：豫呵其若冬涉水，犹呵其若畏四邻。严呵其若客。涣呵其若凌释，敦呵其若朴，浑呵其若浊，旷呵其若浴（谷）。浊而静之，徐清。安以重之。徐生。保此道不欲盈。夫唯不欲盈，是以能敝而不成。"},
            {t:"第60章", c:"至虚，极也。守情，表也。万物旁作，吾以观其复也。天物云云，各复归于其根。归根曰静，静，是谓复命。复命常也。知常明也。不知常妄。妄作，凶。知常容。容乃公，公乃王，王乃天，天乃道，道乃久，没（莫）身不殆。"},
            {t:"第61章", c:"太上，下知有之。其次，亲誉之。其次，畏之。其下，侮之。信不足，案有不信。犹呵，其贵言也。成功遂事，而百姓谓我自然。"},
            {t:"第62章", c:"故大道废，案有仁义。智慧出，案有大伪。六亲不和，案有孝慈。邦家昏乱，案有贞臣。"},
            {t:"第63章", c:"绝圣弃智，民利百倍。绝仁弃义，民复孝慈。绝巧弃利，盗贼无有。此三言也，以为文未足，故令之有所属（主）。见（现）素抱朴，少私而寡欲。绝学无忧。"},
            {t:"第64章", c:"唯与呵，其相去几何？美与丑，其相去何若？人之所畏，亦不可以不畏人。望呵，其未央哉！众人熙熙，若飨（享）于太牢，而春登台。我泊焉未兆，若婴儿未咳（孩）。累呵，如无所归。众人皆有余，我独匮。我愚人之心也，沌沌呵。俗人昭昭，我独若昏呵。俗人察察，我独闷闷呵。惚呵，其若海，恍呵，其若无所止。众人皆有以，我独顽以俚。我欲独异于人，而贵食母。"},
            {t:"第65章", c:"孔德之容，唯道是从。道之物，唯恍唯惚。惚呵恍呵，中有象呵。恍呵惚呵，中有物呵。幽呵冥呵，中有情呵。其情甚真，其中有信。自今及古，其名不去，以顺众父。吾何以知众父之然也，以此。"},
            {t:"第66章", c:"炊者不立。自视者不彰，自见者不明，自伐者无功，自矜者不长（掌）。其在道，曰余食赘行。物或恶（物）之，故有欲者弗居。"},
            {t:"第67章", c:"曲则全，枉则正，洼则盈，敝则新，少则得，多则惑。是以圣人执一，以为天下牧。不自视故彰。不自见故明。不自伐故有功。弗矜故能长。夫唯不争，故莫能与之争。古之所谓曲全者，岂语哉！成全归之。"},
            {t:"第68章", c:"希言自然。飘风不终朝（招），暴雨不终日，孰为此？天地，而弗能久，又况于人乎？故从事而道者同于道，德者同于德，失者同于失。同于德者，道亦德之。同于失者，道亦失之。"},
            {t:"第69章", c:"有物混成，先天地生。寂呵寥呵，独立而不改，可以为天地母。吾未知其名，字之曰道，吾强为之名曰大。大曰逝，逝曰远，远曰反。道大，天大，地大，王亦大。国中有四大，而王居一焉。人法地，地法天，天法道，道法自然。"},
            {t:"第70章", c:"重为轻根，静为躁君。是以君子终日行，不离其辎重，唯有环观（贯），燕处则超若。若何万乘（胜）之王，而以身轻于天下？轻则失本，躁则失君。"},
            {t:"第71章", c:"善行者无辙迹，善言者无瑕谪，善数者不以筹策，善闭者无关钥（月）而不可启也，善结者无绳约而不可解也。是以圣人恒善救人，而无弃人。物无弃材，是谓袭明。故善人，善人之师；不善人，善人之资也。不贵其师，不爱其资，为智乎大迷，是为妙要。"},
            {t:"第72章", c:"知其雄，守其雌，为天下溪。为天下溪，恒德不离。恒德不离，复归于婴儿。知其荣，守其辱，为天下浴（谷）。为天下浴，恒德乃足。恒德乃足，复归于朴。知其白，守其黑，为天下式。为天下式，恒德不忒（特）。恒德不忒（特），复归于无极。朴散则为器，圣人用则为官长，夫大制无割。"},
            {t:"第73章", c:"将欲取天下而为之，吾见其弗得已。夫天下神器也，非可为者也。为者败之，执者失之。物或行或随，或嘘或吹，或强或羸，或培或堕（灰）。是以圣人去甚，去泰，去奢。"},
            {t:"第74章", c:"以道佐人主，不以兵强于天下，其事好（浩）还。师之所居，楚棘生之。善者果而已矣，毋以取强焉。果而毋骄，果而毋矜，果而毋伐，果而毋得已居，是谓果而不强。物壮而老，是谓之不道，不道早已。"},
            {t:"第75章", c:"夫兵者，不祥之器也。物或恶之，故有欲者弗居。君子居则贵左，用兵则贵右，故兵者非君子之器也。兵者不祥之器也，不得已而用之，铦（先）袭（习）为上，勿美也。若美之，是乐杀人也。夫乐杀人，不可以得志于天下矣。是以吉事上左，丧事上右。是以偏将军居左，上将军居右，言以丧礼居之也。杀人众以悲哀莅之，战胜，以丧礼处之。"},
            {t:"第76章", c:"道恒无名，朴唯小，而天下弗敢臣。侯王若能守之，万物将自宾。天地相合，以雨甘露，民莫之令而自均焉。始制有名，名亦既有，夫亦将知止，知止所以不殆。譬道之在天下也，犹小浴（谷）之与江海也。"},
            {t:"第77章", c:"知人者，智也。自知者，明也。胜人者，有力也。自胜者，强也。知足者，富也。强行者，有志也。不失其所者，久也。死而不亡者，寿也。"},
            {t:"第78章", c:"道氾（帆）呵，其可左右也。成功遂事而弗名有也，万物归焉而弗为主，则恒无欲也，可名于小。万物归焉而弗为主，可名于大。是以圣人之能成大也，以其不为大也，故能成大。"},
            {t:"第79章", c:"执大象，天下往。往而不害，安平泰。乐（月）与饵，过客止。故道之出言也，曰呵淡其无味也。视之不足见也，听之不足闻也，用之不可既也。"},
            {t:"第80章", c:"将欲翕之，必固张之。将欲弱之，必固强之。将欲去之，必固举之。将欲夺之，必固予之。是谓微明。柔弱胜强。鱼不可脱于渊，邦利器不可以示人。"},
            {t:"第81章", c:"道恒无名，王侯若能守之，万物将自化。化而欲作，吾将镇之以无名之朴。镇之以无名之朴，夫将不辱。不辱以情，天地将自正。"}
        ];

        let currentIndex = 0;
        const { html } = pinyinPro; // 解构拼音库函数

        // 初始化
        function init() {
            const select = document.getElementById('chapter-select');
            bookData.forEach((chapter, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.text = chapter.t;
                select.appendChild(option);
            });
            
            // 默认加载第一章
            render();

            // 键盘事件
            document.addEventListener('keydown', (e) => {
                if(e.key === "ArrowLeft") prevChapter();
                if(e.key === "ArrowRight") nextChapter();
            });
        }

        // 核心渲染函数
        function render() {
            const titleEl = document.getElementById('chapter-title');
            const textEl = document.getElementById('text-content');
            const select = document.getElementById('chapter-select');
            const progress = document.getElementById('progress');

            // 1. 动画淡出
            textEl.style.opacity = 0;

            setTimeout(() => {
                const data = bookData[currentIndex];
                titleEl.textContent = data.t;
                select.value = currentIndex;

                // 2. 自动生成注音HTML (核心逻辑)
                // 使用 pinyin-pro 的 html 方法，resultType: 'array' 方便我们自定义，但这里直接用 standard 模式
                const pinyinHtml = html(data.c, {
                    toneType: 'symbol',
                    v: true 
                });
                
                textEl.innerHTML = pinyinHtml;

                // 3. 智能字号调整
                const charCount = data.c.length;
                if (charCount < 50) {
                    textEl.style.fontSize = "3.5rem";
                } else if (charCount < 100) {
                    textEl.style.fontSize = "2.8rem";
                } else if (charCount < 200) {
                    textEl.style.fontSize = "2.2rem";
                } else {
                    textEl.style.fontSize = "1.8rem";
                }

                // 4. 更新进度条
                const pct = ((currentIndex + 1) / bookData.length) * 100;
                progress.style.width = pct + "%";

                // 5. 动画淡入
                textEl.style.opacity = 1;

            }, 200);
        }

        function prevChapter() {
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        }

        function nextChapter() {
            if (currentIndex < bookData.length - 1) {
                currentIndex++;
                render();
            }
        }

        function jumpToChapter() {
            const select = document.getElementById('chapter-select');
            currentIndex = parseInt(select.value);
            render();
        }

        function togglePinyin() {
            document.body.classList.toggle('hide-pinyin');
        }

        // 启动
        init();

    </script>
</body>
</html>
